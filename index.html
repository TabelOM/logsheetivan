<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logsheet Ivan</title>
    
    <link rel="icon" type="image/png" href="icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #000000;
            --accent: #3ecf8e;
            --bg: #f3f4f6;
            --border: #e5e7eb;
            --text: #1f2937;
        }

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden; }

        .auth-wrapper { height: 100vh; display: flex; align-items: center; justify-content: center; background: #000; position: fixed; inset: 0; z-index: 2000; }
        .login-box { background: white; padding: 40px; border-radius: 24px; width: 90%; max-width: 400px; text-align: center; }

        .app-layout { display: flex; min-height: 100vh; }
        .app-sidebar { width: 280px; background: white; border-right: 1px solid var(--border); position: fixed; height: 100vh; z-index: 100; transition: transform 0.3s ease; }
        .app-main { flex: 1; margin-left: 280px; padding: 20px; transition: margin-left 0.3s ease; }
        
        .sidebar-hide .app-sidebar { transform: translateX(-280px); }
        .sidebar-hide .app-main { margin-left: 0; }

        .nav-item { display:flex; gap:15px; padding:15px; border-radius:12px; font-weight:600; cursor:pointer; margin: 0 20px 5px 20px; color: #6b7280; transition: 0.2s; }
        .nav-item.active { background: #000; color: white; }

        .table-wrapper { background: white; border-radius: 20px; border: 1px solid var(--border); overflow: hidden; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px 30px; background: #fafafa; font-size: 11px; text-transform: uppercase; color: #6b7280; }
        td { padding: 18px 30px; border-bottom: 1px solid var(--border); font-size: 14px; }

        .status-toggle-btn { 
            border: none; padding: 10px 18px; border-radius: 12px; font-size: 11px; font-weight: 800; 
            text-transform: uppercase; cursor: pointer; transition: 0.2s; min-width: 140px;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        }
        .st-todo { background: #f3f4f6; color: #4b5563; border: 1.5px solid #d1d5db; }
        .st-progress { background: #eff6ff; color: #1d4ed8; border: 1.5px solid #bfdbfe; }
        .st-done { background: #000; color: #3ecf8e; border: 1.5px solid #333; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); z-index: 1500; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .modal-box { background: white; width: 100%; max-width: 750px; max-height: 90vh; overflow-y: auto; border-radius: 24px; padding: 30px; }
        .f-group { margin-bottom: 15px; }
        .f-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; }
        .f-group input { width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 12px; outline: none; font-size: 14px; }
        
        .rich-editor { height: 250px; border-radius: 0 0 12px 12px; margin-bottom: 20px; }
        .ql-toolbar.ql-snow { border-radius: 12px 12px 0 0; background: #fafafa; }

        .btn-add { background: black; color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .btn-round { width: 45px; height: 45px; border-radius: 12px; border: 1px solid var(--border); background: white; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #333; color: white; padding: 12px 24px; border-radius: 12px; transition: 0.3s; z-index: 3000; }
        .toast.show { transform: translateX(-50%) translateY(0); }

        @media (max-width: 768px) {
            .app-main { margin-left: 0; padding: 15px; }
            thead { display: none; }
            tr { display: block; border: 1px solid var(--border); border-radius: 16px; margin-bottom: 15px; padding: 15px; background: white; }
            td { display: block; padding: 5px 0; border: none; }
            td:before { content: attr(data-label); font-weight: 700; font-size: 10px; color: #999; text-transform: uppercase; display: block; }
        }
    </style>
</head>
<body class="sidebar-hide">

    <div id="loginPage" class="auth-wrapper">
        <div class="login-box">
            <h2 style="font-weight:800; font-size:28px;">WorkLog<span style="color:var(--accent)">.</span></h2>
            <input type="password" id="password" placeholder="Password" style="width:100%; padding:15px; border-radius:12px; border:1px solid #ddd; margin-bottom:20px; text-align:center; font-size:16px;">
            <button onclick="handleLogin()" class="btn-add" style="width:100%; justify-content:center;">Sign In</button>
        </div>
    </div>

    <div id="mainDashboard" class="app-layout" style="display: none;">
        <aside class="app-sidebar">
            <div style="padding:30px; font-size:24px; font-weight:800;">WorkLog<span style="color:var(--accent)">.</span></div>
            <nav>
                <div onclick="switchTab('log')" id="menuLog" class="nav-item active"><i data-lucide="layout-dashboard"></i> Log Belajar</div>
                <div onclick="switchTab('plan')" id="menuPlan" class="nav-item"><i data-lucide="book-open"></i> Learning Plan</div>
                <div onclick="switchTab('todo')" id="menuTodo" class="nav-item"><i data-lucide="check-square"></i> Daily Todo</div>
            </nav>
        </aside>

        <main class="app-main">
            <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; flex-wrap:wrap; gap:15px;">
                <div style="display:flex; gap:15px; align-items:center;">
                    <button id="menuBtn" onclick="document.body.classList.toggle('sidebar-hide')" class="btn-round"><i data-lucide="menu"></i></button>
                    <div><h3 id="digitalClock" style="margin:0">00:00</h3><span id="currentDate" style="color:gray; font-size:12px;">Date</span></div>
                </div>
                <div style="display:flex; gap:10px;">
                    <button onclick="switchTab('todo')" class="btn-round" title="Daily Todo" style="background: var(--accent); color: white; border: none;"><i data-lucide="check-square"></i></button>
                    <button onclick="handleNewEntry()" class="btn-add"><i data-lucide="plus"></i> New Entry</button>
                </div>
            </header>

            <div class="table-wrapper">
                <table>
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="modalLog" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h2 id="modalTitleLog">New Work Log</h2>
            <form id="logForm">
                <input type="hidden" id="editId">
                <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:15px;">
                    <div class="f-group"><label>Log Date</label><input type="date" id="logDate" required></div>
                    <div class="f-group"><label>Category</label><input type="text" id="categoryLog" required></div>
                </div>
                <div class="f-group"><label>Key Learning</label><input type="text" id="keyLearning" required></div>
                <div class="f-group"><label>Notes</label><div id="editorLog" class="rich-editor"></div></div>
               <div style="display:flex; gap:10px;">
                    <button type="button" id="btnDeleteLog" onclick="deleteLogFromForm()" style="display:none; flex:1; padding:15px; border-radius:12px; border:1px solid #ff4d4d; background:#fff5f5; color:#ff4d4d; font-weight:700; cursor:pointer;">Delete</button>
                    <button type="button" onclick="closeModal('modalLog')" style="flex:1; padding:15px; border-radius:12px; border:1px solid #ddd; background:white; font-weight:700;">Cancel</button>
                    <button type="submit" class="btn-add" style="flex:1; justify-content:center;">Save</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modalPlan" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h2 id="modalTitlePlan">Learning Plan</h2>
            <form id="planForm">
                <input type="hidden" id="planEditId">
                <div class="f-group"><label>Topic to Learn</label><input type="text" id="planTopic" required></div>
                <div class="f-group"><label>Keterangan</label><div id="editorPlan" class="rich-editor"></div></div>
                <div class="f-group">
                    <label>Set Status</label>
                    <div style="display: flex; gap: 10px;">
                        <button type="button" onclick="setStatusValue('To Do')" id="btnOptTodo" class="status-toggle-btn st-todo" style="flex:1;">To Do</button>
                        <button type="button" onclick="setStatusValue('In Progress')" id="btnOptProgress" class="status-toggle-btn" style="flex:1; border:1px solid #ddd;">In Progress</button>
                        <button type="button" onclick="setStatusValue('Completed')" id="btnOptDone" class="status-toggle-btn" style="flex:1; border:1px solid #ddd;">Completed</button>
                    </div>
                    <input type="hidden" id="planStatusHidden" value="To Do">
                </div>
                <div style="display:flex; gap:10px; margin-top: 20px;">
                    <button type="button" id="btnDeletePlan" onclick="deletePlanFromForm()" style="display:none; flex:1; padding:15px; border-radius:12px; border:1px solid #ff4d4d; background:#fff5f5; color:#ff4d4d; font-weight:700; cursor:pointer;">Delete</button>
                    <button type="button" onclick="closeModal('modalPlan')" style="flex:1; padding:15px; border-radius:12px; border:1px solid #ddd; background:white; font-weight:700;">Cancel</button>
                    <button type="submit" class="btn-add" style="flex:1; justify-content:center;">Save Plan</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modalTodo" class="modal-overlay" style="display: none;">
        <div class="modal-box" style="max-width: 450px;">
            <h2>New Task</h2>
            <form id="todoForm">
                <div class="f-group"><label>Task Name</label><input type="text" id="todoTask" placeholder="Apa yang ingin dikerjakan?" required></div>
                <div style="display:flex; gap:10px;">
                    <button type="button" onclick="closeModal('modalTodo')" style="flex:1; padding:15px; border-radius:12px; border:1px solid #ddd; background:white; font-weight:700;">Cancel</button>
                    <button type="submit" class="btn-add" style="flex:1; justify-content:center;">Add Task</button>
                </div>
            </form>
        </div>
    </div>

    <div id="detailOverlay" class="modal-overlay" style="display: none;">
        <div class="modal-box" style="border-left: 8px solid var(--accent);">
            <h2 id="detTitle" style="margin:0">Title</h2>
            <hr style="border:0; border-top:1px solid var(--border); margin:15px 0;">
            <div id="detContent" class="ql-editor" style="background:#f9fafb; border-radius:16px; padding:15px; min-height:100px;"></div>
            <button onclick="closeModal('detailOverlay')" style="width:100%; margin-top:20px; padding:15px; border-radius:12px; background:black; color:white; font-weight:700; border:none;">Close</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const SUPABASE_URL = "https://eqvvznninjlxuijmazxi.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVxdnZ6bm5pbmpseHVpam1henhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAwMDI2OTQsImV4cCI6MjA4NTU3ODY5NH0.KaBBl4zeybCtxBDm9bR6R8v-shlkns2MjvKL2VuvgpQ";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let quillLog, quillPlan, currentTab = 'log';

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            setInterval(startTime, 1000);
            const toolbar = [['bold', 'italic'], [{ 'list': 'ordered'}, { 'list': 'bullet' }]];
            quillLog = new Quill('#editorLog', { theme: 'snow', modules: { toolbar } });
            quillPlan = new Quill('#editorPlan', { theme: 'snow', modules: { toolbar } });
            document.getElementById('password').addEventListener('keypress', e => { if(e.key === 'Enter') handleLogin(); });
        });

        function handleLogin() {
            if(document.getElementById('password').value === '123') {
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('mainDashboard').style.display = 'flex';
                switchTab('log');
            } else { showToast("Password Salah!"); }
        }

        async function switchTab(tab) {
            currentTab = tab;
            document.getElementById('menuLog').classList.toggle('active', tab === 'log');
            document.getElementById('menuPlan').classList.toggle('active', tab === 'plan');
            document.getElementById('menuTodo').classList.toggle('active', tab === 'todo');
            const tableHead = document.getElementById('tableHead');
            
            if(tab === 'plan') {
                tableHead.innerHTML = `<tr><th>Topic</th><th>Keterangan</th><th>Action</th><th style="text-align:center">Status</th></tr>`;
                loadPlanData();
            } else if(tab === 'todo') {
                tableHead.innerHTML = `<tr><th style="width:60px">Done</th><th>Task</th><th style="text-align:right">Action</th></tr>`;
                loadTodoData();
            } else {
                tableHead.innerHTML = `<tr><th>Date</th><th>Category</th><th>Key Learning</th><th>Action</th></tr>`;
                loadLogData();
            }
        }

        async function loadLogData() {
            const { data } = await _supabase.from('logData').select('*')
                .order('logDate', { ascending: false })
                .order('created_at', { ascending: false }); // Menampilkan yang terbaru jika tanggal sama

            document.getElementById('tableBody').innerHTML = (data || []).map(row => `
                <tr>
                    <td data-label="Date">${row.logDate}</td>
                    <td data-label="Category"><span style="background:#eee; padding:4px 8px; border-radius:6px; font-size:11px;">${row.categoryLog}</span></td>
                    <td data-label="Key Learning" style="font-weight:600">${row.keyLearning}</td>
                    <td data-label="Action">
                        <div style="display:flex; gap:10px;">
                            <button onclick='viewDetail("log", ${JSON.stringify(row)})' style="border:none; background:none; color:#3b82f6; cursor:pointer;"><i data-lucide="eye"></i></button>
                            <button onclick='editLog(${JSON.stringify(row)})' style="border:none; background:none; color:#666; cursor:pointer;"><i data-lucide="edit-3"></i></button>
                        </div>
                    </td>
                </tr>
            `).join('');
            lucide.createIcons();
        }

        async function loadPlanData() {
            const { data } = await _supabase.from('learningPlan').select('*').order('created_at', { ascending: false });
            document.getElementById('tableBody').innerHTML = (data || []).map(row => {
                let sClass = row.status === 'Completed' ? 'st-done' : row.status === 'In Progress' ? 'st-progress' : 'st-todo';
                let sIcon = row.status === 'Completed' ? 'check-circle' : row.status === 'In Progress' ? 'loader' : 'circle';
                return `<tr>
                    <td data-label="Topic" style="font-weight:700">${row.topic}</td>
                    <td data-label="Keterangan"><button onclick='viewDetail("plan", ${JSON.stringify(row)})' style="border:1px solid #ddd; background:white; padding:6px 12px; border-radius:8px; cursor:pointer; font-size:12px;">Lihat Materi</button></td>
                    <td data-label="Action"><button onclick='editPlan(${JSON.stringify(row)})' style="border:none; background:none; color:#666; cursor:pointer;"><i data-lucide="edit-3" style="width:18px"></i></button></td>
                    <td data-label="Status" style="text-align:center"><button onclick='toggleStatus("${row.id}", "${row.status}")' class="status-toggle-btn ${sClass}"><i data-lucide="${sIcon}" style="width:14px"></i> ${row.status || 'To Do'}</button></td>
                </tr>`;
            }).join('');
            lucide.createIcons();
        }

        async function loadTodoData() {
            const { data } = await _supabase.from('dailyTodo').select('*').order('created_at', { ascending: false });
            document.getElementById('tableBody').innerHTML = (data || []).map(row => `
                <tr style="${row.is_done ? 'opacity:0.5' : ''}">
                    <td data-label="Status"><input type="checkbox" ${row.is_done ? 'checked' : ''} onchange="toggleTodoStatus('${row.id}', ${row.is_done})" style="width:20px; height:20px; accent-color:var(--accent); cursor:pointer;"></td>
                    <td data-label="Task" style="${row.is_done ? 'text-decoration:line-through' : 'font-weight:600'}">${row.task}</td>
                    <td data-label="Action" style="text-align:right"><button onclick="deleteTodo('${row.id}')" style="border:none; background:none; color:#ff4d4d; cursor:pointer;"><i data-lucide="trash-2" style="width:18px"></i></button></td>
                </tr>
            `).join('');
            lucide.createIcons();
        }

        function handleNewEntry() {
            if(currentTab === 'todo') {
                document.getElementById('modalTodo').style.display = 'flex';
                document.getElementById('todoForm').reset();
            } else if(currentTab === 'log') {
                document.getElementById('modalLog').style.display = 'flex';
                document.getElementById('btnDeleteLog').style.display = 'none';
                document.getElementById('logForm').reset(); quillLog.setContents([]);
                document.getElementById('editId').value = "";
                document.getElementById('logDate').value = new Date().toISOString().split('T')[0];
            } else {
                document.getElementById('modalPlan').style.display = 'flex';
                document.getElementById('btnDeletePlan').style.display = 'none';
                document.getElementById('planForm').reset(); quillPlan.setContents([]);
                document.getElementById('planEditId').value = "";
            }
        }

        document.getElementById('logForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const payload = {
                logDate: document.getElementById('logDate').value,
                categoryLog: document.getElementById('categoryLog').value,
                keyLearning: document.getElementById('keyLearning').value,
                notesLog: quillLog.root.innerHTML
            };
            let res = id ? await _supabase.from('logData').update(payload).eq('id', id) : await _supabase.from('logData').insert([payload]);
            if(!res.error) { closeModal('modalLog'); loadLogData(); showToast("Tersimpan!"); }
        };

        document.getElementById('planForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('planEditId').value;
            const payload = {
                topic: document.getElementById('planTopic').value,
                description: quillPlan.root.innerHTML,
                status: id ? undefined : "To Do"
            };
            let res = id ? await _supabase.from('learningPlan').update(payload).eq('id', id) : await _supabase.from('learningPlan').insert([payload]);
            if(!res.error) { closeModal('modalPlan'); loadPlanData(); showToast("Plan Tersimpan!"); }
        };

        document.getElementById('todoForm').onsubmit = async (e) => {
            e.preventDefault();
            const task = document.getElementById('todoTask').value;
            const { error } = await _supabase.from('dailyTodo').insert([{ task, is_done: false }]);
            if(!error) { closeModal('modalTodo'); loadTodoData(); showToast("Task ditambahkan!"); }
        };

        async function toggleTodoStatus(id, current) {
            await _supabase.from('dailyTodo').update({ is_done: !current }).eq('id', id);
            loadTodoData();
        }

        async function deleteTodo(id) {
            if(confirm("Hapus task ini?")) { await _supabase.from('dailyTodo').delete().eq('id', id); loadTodoData(); }
        }

        function editLog(row) {
            handleNewEntry();
            document.getElementById('btnDeleteLog').style.display = 'block';
            document.getElementById('editId').value = row.id;
            document.getElementById('logDate').value = row.logDate;
            document.getElementById('categoryLog').value = row.categoryLog;
            document.getElementById('keyLearning').value = row.keyLearning;
            quillLog.root.innerHTML = row.notesLog || "";
        }

        function editPlan(row) {
            document.getElementById('modalPlan').style.display = 'flex';
            document.getElementById('btnDeletePlan').style.display = 'block';
            document.getElementById('planEditId').value = row.id;
            document.getElementById('planTopic').value = row.topic;
            quillPlan.root.innerHTML = row.description || "";
        }

        async function toggleStatus(id, currentStatus) {
            let nextStatus = currentStatus === "To Do" ? "In Progress" : currentStatus === "In Progress" ? "Completed" : "To Do";
            await _supabase.from('learningPlan').update({ status: nextStatus }).eq('id', id);
            loadPlanData();
        }

        function viewDetail(type, row) {
            document.getElementById('detailOverlay').style.display = 'flex';
            document.getElementById('detTitle').innerText = (type === 'log') ? row.keyLearning : row.topic;
            document.getElementById('detContent').innerHTML = (type === 'log') ? (row.notesLog || "No notes") : (row.description || "No description");
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }
        function startTime() {
            const now = new Date();
            document.getElementById('digitalClock').innerText = now.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
            document.getElementById('currentDate').innerText = now.toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long'});
        }
        function setStatusValue(status) {
            document.getElementById('planStatusHidden').value = status;
            ['btnOptTodo', 'btnOptProgress', 'btnOptDone'].forEach(id => {
                const b = document.getElementById(id);
                b.style.background = 'white'; b.style.color = '#666'; b.style.border = '1px solid #ddd';
            });
            const active = status === 'To Do' ? 'btnOptTodo' : status === 'In Progress' ? 'btnOptProgress' : 'btnOptDone';
            document.getElementById(active).style.background = status === 'Completed' ? '#000' : '#eff6ff';
            document.getElementById(active).style.color = status === 'Completed' ? 'var(--accent)' : '#1d4ed8';
        }

        async function deleteLogFromForm() {
            const id = document.getElementById('editId').value;
            if(id && confirm("Hapus log?")) {
                await _supabase.from('logData').delete().eq('id', id);
                closeModal('modalLog'); loadLogData();
            }
        }
        async function deletePlanFromForm() {
            const id = document.getElementById('planEditId').value;
            if(id && confirm("Hapus plan?")) {
                await _supabase.from('learningPlan').delete().eq('id', id);
                closeModal('modalPlan'); loadPlanData();
            }
        }
    </script>
</body>
</html>
