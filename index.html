<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logsheet Ivan - WorkLog</title>
    
    <link rel="icon" type="image/png" href="icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #000000;
            --accent: #3ecf8e;
            --bg: #f3f4f6;
            --border: #e5e7eb;
            --text: #1f2937;
        }

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden; }

        /* AUTH */
        .auth-wrapper { height: 100vh; display: flex; align-items: center; justify-content: center; background: #000; position: fixed; inset: 0; z-index: 2000; }
        .login-box { background: white; padding: 40px; border-radius: 24px; width: 90%; max-width: 400px; text-align: center; }

        /* LAYOUT */
        .app-layout { display: flex; min-height: 100vh; }
        .app-sidebar { width: 280px; background: white; border-right: 1px solid var(--border); position: fixed; height: 100vh; z-index: 100; transition: transform 0.3s ease; }
        .app-main { flex: 1; margin-left: 280px; padding: 20px; transition: margin-left 0.3s ease; }
        
        .sidebar-hide .app-sidebar { transform: translateX(-280px); }
        .sidebar-hide .app-main { margin-left: 0; }

        .nav-item { display:flex; gap:15px; padding:15px; border-radius:12px; font-weight:600; cursor:pointer; margin: 0 20px 5px 20px; color: #6b7280; transition: 0.2s; }
        .nav-item.active { background: #000; color: white; }

        /* TABLE */
        .table-wrapper { background: white; border-radius: 20px; border: 1px solid var(--border); overflow: hidden; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px 30px; background: #fafafa; font-size: 11px; text-transform: uppercase; color: #6b7280; }
        td { padding: 18px 30px; border-bottom: 1px solid var(--border); font-size: 14px; }

        /* UI ELEMENTS */
        .btn-add { background: black; color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .btn-round { width: 45px; height: 45px; border-radius: 12px; border: 1px solid var(--border); background: white; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        .status-toggle-btn { border: none; padding: 8px 15px; border-radius: 10px; font-size: 10px; font-weight: 800; text-transform: uppercase; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
        .st-todo { background: #f3f4f6; color: #4b5563; }
        .st-progress { background: #eff6ff; color: #1d4ed8; }
        .st-done { background: #000; color: #3ecf8e; }

        /* MODALS */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); z-index: 1500; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .modal-box { background: white; width: 100%; max-width: 750px; max-height: 90vh; overflow-y: auto; border-radius: 24px; padding: 30px; }
        .f-group { margin-bottom: 15px; }
        .f-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; }
        .f-group input { width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 12px; outline: none; }
        .rich-editor { height: 200px; border-radius: 0 0 12px 12px; }

        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #333; color: white; padding: 12px 24px; border-radius: 12px; transition: 0.3s; z-index: 3000; }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .app-main { margin-left: 0; }
            thead { display: none; }
            tr { display: block; border-bottom: 1px solid var(--border); padding: 15px; }
            td { display: block; padding: 5px 0; border: none; }
            td:before { content: attr(data-label); font-weight: 700; font-size: 10px; color: #999; display: block; }
        }
    </style>
</head>
<body class="sidebar-hide">

    <div id="loginPage" class="auth-wrapper">
        <div class="login-box">
            <h2 style="font-weight:800; font-size:28px;">WorkLog<span style="color:var(--accent)">.</span></h2>
            <input type="password" id="password" placeholder="Password" style="width:100%; padding:15px; border-radius:12px; border:1px solid #ddd; margin-bottom:20px; text-align:center; font-size:16px;">
            <button onclick="handleLogin()" class="btn-add" style="width:100%; justify-content:center;">Sign In</button>
        </div>
    </div>

    <div id="mainDashboard" class="app-layout" style="display: none;">
        <aside class="app-sidebar">
            <div style="padding:30px; font-size:24px; font-weight:800;">WorkLog<span style="color:var(--accent)">.</span></div>
            <nav>
                <div onclick="switchTab('log')" id="menuLog" class="nav-item active"><i data-lucide="layout-dashboard"></i> Log Belajar</div>
                <div onclick="switchTab('plan')" id="menuPlan" class="nav-item"><i data-lucide="book-open"></i> Learning Plan</div>
                <div onclick="openTodoManager()" class="nav-item"><i data-lucide="check-square"></i> Daily Todo</div>
            </nav>
        </aside>

        <main class="app-main">
            <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
                <div style="display:flex; gap:15px; align-items:center;">
                    <button onclick="document.body.classList.toggle('sidebar-hide')" class="btn-round"><i data-lucide="menu"></i></button>
                    <div><h3 id="digitalClock" style="margin:0">00:00</h3><span id="currentDate" style="color:gray; font-size:12px;">Date</span></div>
                </div>
                <div style="display:flex; gap:10px;">
                    <button onclick="openTodoManager()" class="btn-round" style="background: var(--accent); color: white; border: none;"><i data-lucide="check-square"></i></button>
                    <button onclick="handleNewEntry()" class="btn-add"><i data-lucide="plus"></i> New Entry</button>
                </div>
            </header>

            <div class="table-wrapper">
                <table>
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="modalLog" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h2 id="modalTitleLog">Work Log</h2>
            <form id="logForm">
                <input type="hidden" id="editId">
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                    <div class="f-group"><label>Date</label><input type="date" id="logDate" required></div>
                    <div class="f-group"><label>Category</label><input type="text" id="categoryLog" required></div>
                </div>
                <div class="f-group"><label>Key Learning</label><input type="text" id="keyLearning" required></div>
                <div class="f-group"><label>Notes</label><div id="editorLog" class="rich-editor"></div></div>
                <div style="display:flex; gap:10px;">
                    <button type="button" id="btnDeleteLog" onclick="deleteLogFromForm()" style="display:none; flex:1; padding:15px; border-radius:12px; border:1px solid #ff4d4d; color:#ff4d4d; background:none; font-weight:700;">Delete</button>
                    <button type="button" onclick="closeModal('modalLog')" style="flex:1; padding:15px; border-radius:12px; border:1px solid #ddd; background:white;">Cancel</button>
                    <button type="submit" class="btn-add" style="flex:1; justify-content:center;">Save</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modalPlan" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h2>Learning Plan</h2>
            <form id="planForm">
                <input type="hidden" id="planEditId">
                <div class="f-group"><label>Topic</label><input type="text" id="planTopic" required></div>
                <div class="f-group"><label>Description</label><div id="editorPlan" class="rich-editor"></div></div>
                <div class="f-group">
                    <label>Status</label>
                    <div style="display: flex; gap: 10px;">
                        <button type="button" onclick="setPlanStatus('To Do')" id="pTodo" class="status-toggle-btn st-todo" style="flex:1; justify-content:center; padding:12px;">To Do</button>
                        <button type="button" onclick="setPlanStatus('In Progress')" id="pProgress" class="status-toggle-btn" style="flex:1; justify-content:center; border:1px solid #ddd; background:white;">In Progress</button>
                        <button type="button" onclick="setPlanStatus('Completed')" id="pDone" class="status-toggle-btn" style="flex:1; justify-content:center; border:1px solid #ddd; background:white;">Completed</button>
                    </div>
                    <input type="hidden" id="planStatusVal" value="To Do">
                </div>
                <div style="display:flex; gap:10px;">
                    <button type="button" id="btnDeletePlan" onclick="deletePlanFromForm()" style="display:none; flex:1; padding:15px; border-radius:12px; border:1px solid #ff4d4d; color:#ff4d4d; background:none;">Delete</button>
                    <button type="button" onclick="closeModal('modalPlan')" style="flex:1; padding:15px; border-radius:12px; border:1px solid #ddd; background:white;">Cancel</button>
                    <button type="submit" class="btn-add" style="flex:1; justify-content:center;">Save Plan</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modalTodoManager" class="modal-overlay" style="display: none;">
        <div class="modal-box" style="max-width: 480px; padding: 0; overflow: hidden; display: flex; flex-direction: column; height: 80vh;">
            <div style="padding: 25px; background: #000; color: white; display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin:0">Daily Todo List</h3>
                <button onclick="closeModal('modalTodoManager')" style="background:none; border:none; color:white; cursor:pointer;"><i data-lucide="x"></i></button>
            </div>
            <div style="padding: 20px; background: #f9fafb; border-bottom: 1px solid #eee;">
                <form id="todoQuickForm" style="display: flex; gap: 10px;">
                    <input type="text" id="todoQuickInput" placeholder="Tambah tugas baru..." style="flex:1; padding: 12px; border-radius: 12px; border: 1.5px solid #ddd; outline:none;" required>
                    <button type="submit" class="btn-add" style="padding: 0 15px;"><i data-lucide="plus"></i></button>
                </form>
            </div>
            <div id="todoListContainer" style="flex: 1; overflow-y: auto; padding: 10px 20px;"></div>
        </div>
    </div>

    <div id="detailOverlay" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h2 id="detTitle">Title</h2>
            <div id="detContent" class="ql-editor" style="background:#f3f4f6; padding:20px; border-radius:15px; min-height:100px;"></div>
            <button onclick="closeModal('detailOverlay')" class="btn-add" style="width:100%; justify-content:center; margin-top:20px;">Close</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const SUPABASE_URL = "https://eqvvznninjlxuijmazxi.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVxdnZ6bm5pbmpseHVpam1henhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAwMDI2OTQsImV4cCI6MjA4NTU3ODY5NH0.KaBBl4zeybCtxBDm9bR6R8v-shlkns2MjvKL2VuvgpQ";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let quillLog, quillPlan, currentTab = 'log';

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            setInterval(startTime, 1000);
            const tb = [['bold', 'italic'], [{list:'ordered'}, {list:'bullet'}]];
            quillLog = new Quill('#editorLog', { theme: 'snow', modules: { toolbar: tb } });
            quillPlan = new Quill('#editorPlan', { theme: 'snow', modules: { toolbar: tb } });

            // Fitur Enter untuk Login
            document.getElementById('password').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleLogin();
            });
        });

        // Menutup elemen jika klik di luar area
        window.addEventListener('click', (e) => {
            // 1. Otomatis sembunyikan Sidebar jika klik di luar area sidebar 
            // (Hanya berlaku jika sidebar sedang terbuka/muncul)
            const sidebar = document.querySelector('.app-sidebar');
            const menuBtn = document.querySelector('.btn-round'); // Tombol toggle menu
            
            if (!document.body.classList.contains('sidebar-hide')) {
                // Jika klik bukan di dalam sidebar DAN bukan di tombol menu
                if (!sidebar.contains(e.target) && !menuBtn.contains(e.target)) {
                    document.body.classList.add('sidebar-hide');
                }
            }

            // 2. Otomatis tutup Modal (Log, Plan, Todo, Detail) jika klik pada overlay hitam
            // Kita cukup cek apakah yang diklik adalah class 'modal-overlay'
            if (e.target.classList.contains('modal-overlay')) {
                e.target.style.display = 'none';
            }
        });

        function handleLogin() {
            if(document.getElementById('password').value === '123') {
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('mainDashboard').style.display = 'flex';
                switchTab('log');
            } else { showToast("Password Salah!"); }
        }

        async function switchTab(t) {
            currentTab = t;
            document.getElementById('menuLog').classList.toggle('active', t === 'log');
            document.getElementById('menuPlan').classList.toggle('active', t === 'plan');
            const head = document.getElementById('tableHead');
            
            if(t === 'plan') {
                head.innerHTML = `<tr><th>Topic</th><th>Details</th><th>Action</th><th>Status</th></tr>`;
                loadPlanData();
            } else {
                head.innerHTML = `<tr><th>Date</th><th>Category</th><th>Key Learning</th><th>Action</th></tr>`;
                loadLogData();
            }
        }

        async function loadLogData() {
            const { data } = await _supabase.from('logData').select('*').order('logDate', {ascending:false}).order('created_at', {ascending:false});
            document.getElementById('tableBody').innerHTML = (data || []).map(row => `
                <tr>
                    <td data-label="Date">${row.logDate}</td>
                    <td data-label="Category"><span style="background:#eee; padding:4px 8px; border-radius:6px; font-size:11px;">${row.categoryLog}</span></td>
                    <td data-label="Key Learning" style="font-weight:600">${row.keyLearning}</td>
                    <td data-label="Action">
                        <div style="display:flex; gap:8px;">
                            <button onclick='viewDetail("log", ${JSON.stringify(row)})' style="border:none; background:none; color:#3b82f6; cursor:pointer;"><i data-lucide="eye"></i></button>
                            <button onclick='editLog(${JSON.stringify(row)})' style="border:none; background:none; color:#666; cursor:pointer;"><i data-lucide="edit-3"></i></button>
                        </div>
                    </td>
                </tr>
            `).join('');
            lucide.createIcons();
        }

        async function loadPlanData() {
            const { data } = await _supabase.from('learningPlan').select('*').order('created_at', {ascending:false});
            document.getElementById('tableBody').innerHTML = (data || []).map(row => {
                let sc = row.status === 'Completed' ? 'st-done' : row.status === 'In Progress' ? 'st-progress' : 'st-todo';
                return `<tr>
                    <td data-label="Topic" style="font-weight:700">${row.topic}</td>
                    <td><button onclick='viewDetail("plan", ${JSON.stringify(row)})' style="border:1px solid #ddd; background:white; padding:5px 10px; border-radius:8px; cursor:pointer; font-size:12px;">Lihat</button></td>
                    <td><button onclick='editPlan(${JSON.stringify(row)})' style="border:none; background:none; color:#666; cursor:pointer;"><i data-lucide="edit-3"></i></button></td>
                    <td><button onclick='togglePlanStatus("${row.id}", "${row.status}")' class="status-toggle-btn ${sc}">${row.status || 'To Do'}</button></td>
                </tr>`;
            }).join('');
            lucide.createIcons();
        }

        // --- TODO POPUP LOGIC ---
        function openTodoManager() {
            document.getElementById('modalTodoManager').style.display = 'flex';
            loadTodoListOnly();
        }

        async function loadTodoListOnly() {
            const { data } = await _supabase.from('dailyTodo').select('*').order('created_at', {ascending:false});
            const container = document.getElementById('todoListContainer');
            container.innerHTML = (data || []).map(row => `
                <div style="display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid #eee; ${row.is_done ? 'opacity:0.5' : ''}">
                    <input type="checkbox" ${row.is_done ? 'checked' : ''} onchange="toggleTodo('${row.id}', ${row.is_done})" style="width:18px; height:18px; cursor:pointer; accent-color:var(--accent);">
                    <span style="flex:1; font-size:14px; ${row.is_done ? 'text-decoration:line-through' : 'font-weight:500'}">${row.task}</span>
                    <button onclick="deleteTodo('${row.id}')" style="border:none; background:none; color:#ff4d4d; cursor:pointer;"><i data-lucide="trash-2" style="width:16px"></i></button>
                </div>
            `).join('') || '<p style="text-align:center; color:gray; margin-top:20px;">No tasks for today.</p>';
            lucide.createIcons();
        }

        document.getElementById('todoQuickForm').onsubmit = async (e) => {
            e.preventDefault();
            const inp = document.getElementById('todoQuickInput');
            await _supabase.from('dailyTodo').insert([{ task: inp.value, is_done: false }]);
            inp.value = ''; loadTodoListOnly();
        };

        async function toggleTodo(id, cur) { await _supabase.from('dailyTodo').update({is_done: !cur}).eq('id', id); loadTodoListOnly(); }
        async function deleteTodo(id) { if(confirm("Hapus task?")) { await _supabase.from('dailyTodo').delete().eq('id', id); loadTodoListOnly(); } }

        // --- CRUD HELPERS ---
        function handleNewEntry() {
            if(currentTab === 'log') {
                document.getElementById('modalLog').style.display = 'flex';
                document.getElementById('logForm').reset(); quillLog.setContents([]);
                document.getElementById('editId').value = '';
                document.getElementById('btnDeleteLog').style.display = 'none';
                document.getElementById('logDate').value = new Date().toISOString().split('T')[0];
            } else {
                document.getElementById('modalPlan').style.display = 'flex';
                document.getElementById('planForm').reset(); quillPlan.setContents([]);
                document.getElementById('planEditId').value = '';
                document.getElementById('btnDeletePlan').style.display = 'none';
            }
        }

        document.getElementById('logForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const payload = {
                logDate: document.getElementById('logDate').value,
                categoryLog: document.getElementById('categoryLog').value,
                keyLearning: document.getElementById('keyLearning').value,
                notesLog: quillLog.root.innerHTML
            };
            if(id) await _supabase.from('logData').update(payload).eq('id', id);
            else await _supabase.from('logData').insert([payload]);
            closeModal('modalLog'); loadLogData(); showToast("Log Saved!");
        };

        document.getElementById('planForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('planEditId').value;
            const payload = {
                topic: document.getElementById('planTopic').value,
                description: quillPlan.root.innerHTML,
                status: document.getElementById('planStatusVal').value
            };
            if(id) await _supabase.from('learningPlan').update(payload).eq('id', id);
            else await _supabase.from('learningPlan').insert([payload]);
            closeModal('modalPlan'); loadPlanData(); showToast("Plan Saved!");
        };

        function editLog(row) {
            handleNewEntry();
            document.getElementById('editId').value = row.id;
            document.getElementById('logDate').value = row.logDate;
            document.getElementById('categoryLog').value = row.categoryLog;
            document.getElementById('keyLearning').value = row.keyLearning;
            quillLog.root.innerHTML = row.notesLog || '';
            document.getElementById('btnDeleteLog').style.display = 'block';
        }

        function editPlan(row) {
            document.getElementById('modalPlan').style.display = 'flex';
            document.getElementById('planEditId').value = row.id;
            document.getElementById('planTopic').value = row.topic;
            quillPlan.root.innerHTML = row.description || '';
            setPlanStatus(row.status || 'To Do');
            document.getElementById('btnDeletePlan').style.display = 'block';
        }

        async function togglePlanStatus(id, cur) {
            let next = cur === 'To Do' ? 'In Progress' : cur === 'In Progress' ? 'Completed' : 'To Do';
            await _supabase.from('learningPlan').update({status: next}).eq('id', id);
            loadPlanData();
        }

        function setPlanStatus(s) {
            document.getElementById('planStatusVal').value = s;
            ['pTodo', 'pProgress', 'pDone'].forEach(id => {
                const b = document.getElementById(id);
                b.style.background = 'white'; b.style.color = '#666'; b.style.border = '1px solid #ddd';
            });
            const act = s === 'To Do' ? 'pTodo' : s === 'In Progress' ? 'pProgress' : 'pDone';
            const el = document.getElementById(act);
            el.style.background = s === 'Completed' ? '#000' : '#eff6ff';
            el.style.color = s === 'Completed' ? 'var(--accent)' : '#1d4ed8';
            el.style.border = 'none';
        }

        async function deleteLogFromForm() { if(confirm("Hapus?")) { await _supabase.from('logData').delete().eq('id', document.getElementById('editId').value); closeModal('modalLog'); loadLogData(); } }
        async function deletePlanFromForm() { if(confirm("Hapus?")) { await _supabase.from('learningPlan').delete().eq('id', document.getElementById('planEditId').value); closeModal('modalPlan'); loadPlanData(); } }

        function viewDetail(t, row) {
            document.getElementById('detailOverlay').style.display = 'flex';
            document.getElementById('detTitle').innerText = t === 'log' ? row.keyLearning : row.topic;
            document.getElementById('detContent').innerHTML = t === 'log' ? row.notesLog : row.description;
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2000); }
        function startTime() {
            const n = new Date();
            document.getElementById('digitalClock').innerText = n.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
            document.getElementById('currentDate').innerText = n.toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long'});
        }
    </script>
</body>
</html>
