<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logsheet Ivan</title>
    
    <link rel="icon" type="image/png" href="icon.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>
        :root {
            --primary: #000000;
            --accent: #3ecf8e;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --border: #e5e7eb;
        }

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden; }

        /* AUTH */
        .auth-wrapper { height: 100vh; display: flex; align-items: center; justify-content: center; background: #000; position: fixed; inset: 0; z-index: 2000; }
        .login-box { background: white; padding: 40px; border-radius: 24px; width: 100%; max-width: 400px; text-align: center; }

        /* LAYOUT */
        .app-layout { display: flex; min-height: 100vh; }
        .app-sidebar { width: 280px; background: white; border-right: 1px solid var(--border); position: fixed; height: 100vh; z-index: 100; transition: transform 0.3s ease; }
        .app-main { flex: 1; margin-left: 280px; padding: 40px; transition: margin-left 0.3s ease; }
        .sidebar-hide .app-sidebar { transform: translateX(-280px); }
        .sidebar-hide .app-main { margin-left: 0; }

        /* UI ELEMENTS */
        .main-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .btn-round { width: 45px; height: 45px; border-radius: 12px; border: 1px solid var(--border); background: white; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .search-bar { background: white; display: flex; align-items: center; padding: 0 15px; border-radius: 12px; border: 1px solid var(--border); width: 280px; }
        .search-bar input { border: none; outline: none; margin-left: 10px; width: 100%; height: 45px; }
        .btn-add { background: black; color: white; border: none; padding: 0 20px; border-radius: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; height: 45px; }

        /* TABLE */
        .table-wrapper { background: white; border-radius: 20px; border: 1px solid var(--border); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px 30px; background: #fafafa; font-size: 11px; text-transform: uppercase; color: var(--text-light); }
        td { padding: 18px 30px; border-bottom: 1px solid var(--border); font-size: 14px; }
        .badge { padding: 4px 10px; border-radius: 6px; font-weight: 700; font-size: 10px; text-transform: uppercase; background: #eee; color: #555; }

        /* MODAL */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); z-index: 1500; display: flex; align-items: center; justify-content: center; }
        .modal-box { background: white; width: 100%; max-width: 700px; max-height: 90vh; overflow-y: auto; border-radius: 24px; padding: 40px; }
        .f-group { margin-bottom: 20px; }
        .f-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; }
        .f-group input { width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 14px; outline: none; }
        
        .rich-editor { height: 350px; border-radius: 0 0 12px 12px; margin-bottom: 20px; }
        .ql-toolbar.ql-snow { border-radius: 12px 12px 0 0; background: #fafafa; }

        /* TOAST */
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #333; color: white; padding: 12px 24px; border-radius: 12px; font-size: 14px; transition: 0.3s; z-index: 3000; }
        .toast.show { transform: translateX(-50%) translateY(0); }
        
        /* QUILL DETAIL CORRECTION */
        #detContent.ql-editor { padding: 20px !important; height: auto; }
        #detContent.ql-editor ol, #detContent.ql-editor ul { padding-left: 1.5em; }
    </style>
</head>
<body class="sidebar-hide">

    <div id="loginPage" class="auth-wrapper">
        <div class="login-box">
            <h2 style="font-weight:800; font-size:28px;">WorkLog<span style="color:var(--accent)">.</span></h2>
            <input type="password" id="password" placeholder="Password" style="width:100%; padding:15px; border-radius:12px; border:1px solid #ddd; margin-bottom:20px; text-align:center;">
            <button onclick="handleLogin()" class="btn-add" style="width:100%; justify-content:center;">Sign In</button>
            <p id="loginError" style="color:red; font-size:12px; margin-top:10px;"></p>
        </div>
    </div>

    <div id="mainDashboard" class="app-layout" style="display: none;">
        <aside class="app-sidebar">
            <div style="padding:30px; font-size:24px; font-weight:800;">WorkLog<span style="color:var(--accent)">.</span></div>
            <nav style="padding:0 20px;"><div style="display:flex; gap:15px; padding:15px; background:#f3f4f6; border-radius:12px; font-weight:600;"><i data-lucide="layout-dashboard"></i> Overview</div></nav>
        </aside>

        <main class="app-main">
            <header class="main-header">
                <div style="display:flex; gap:20px; align-items:center;">
                    <button onclick="document.body.classList.toggle('sidebar-hide')" class="btn-round"><i data-lucide="menu"></i></button>
                    <div><h2 id="digitalClock" style="margin:0">00:00</h2><span id="currentDate" style="color:gray; font-size:13px;">Date</span></div>
                </div>
                <div style="display:flex; gap:15px;">
                    <div class="search-bar"><i data-lucide="search" style="color:gray; width:18px"></i><input type="text" id="globalSearch" placeholder="Cari..." onkeyup="filterTable()"></div>
                    <button onclick="openModal()" class="btn-add"><i data-lucide="plus"></i> New Entry</button>
                </div>
            </header>

            <div class="table-wrapper">
                <table>
                    <thead><tr><th>Date</th><th>Category</th><th style="width:60%">Key Learning</th><th>Action</th></tr></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="modalOverlay" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h2 id="modalTitle">New Entry</h2>
            <form id="workForm">
                <input type="hidden" id="editId">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
                    <div class="f-group"><label>Log Date</label><input type="date" id="logDate" required></div>
                    <div class="f-group"><label>Category</label><input type="text" id="categoryLog" list="categoryList" required><datalist id="categoryList"></datalist></div>
                </div>
                <input type="hidden" id="entryCount">
                <div class="f-group"><label>Key Learning</label><input type="text" id="keyLearning" required></div>
                <div class="f-group"><label>Action Items / Notes</label><div id="editorNotes" class="rich-editor"></div></div>
                <div style="display:flex; gap:15px;">
                    <button type="button" onclick="closeModal()" style="flex:1; padding:15px; border-radius:12px; border:1px solid #ddd; background:white; font-weight:700; cursor:pointer;">Cancel</button>
                    <button type="submit" id="btnSave" style="flex:1; padding:15px; border-radius:12px; border:none; background:black; color:white; font-weight:700; cursor:pointer;">Save Data</button>
                </div>
            </form>
        </div>
    </div>

    <div id="detailOverlay" class="modal-overlay" style="display: none;">
        <div class="modal-box" style="border-left: 8px solid var(--accent);">
            <div style="display:flex; justify-content:space-between; align-items:start;">
                <div>
                    <h1 id="detTitle" style="margin:0 0 5px 0;">Title</h1>
                    <small id="detMeta" style="color:gray; font-weight:600;"></small>
                </div>
                <button onclick="closeDetail()" style="border:none; background:none; cursor:pointer;"><i data-lucide="x"></i></button>
            </div>
            <hr style="border:0; border-top:1px solid var(--border); margin:20px 0;">
            <div id="detContent" class="ql-editor" style="background:#f9fafb; border-radius:16px; border:1px solid var(--border); min-height:150px;"></div>
            <button onclick="closeDetail()" style="width:100%; margin-top:20px; padding:15px; border-radius:12px; background:black; color:white; font-weight:700; border:none; cursor:pointer;">Close</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const SUPABASE_URL = "https://eqvvznninjlxuijmazxi.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVxdnZ6bm5pbmpseHVpam1henhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAwMDI2OTQsImV4cCI6MjA4NTU3ODY5NH0.KaBBl4zeybCtxBDm9bR6R8v-shlkns2MjvKL2VuvgpQ";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let quill, originalData = {};

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            setInterval(startTime, 1000);
            quill = new Quill('#editorNotes', { theme: 'snow', modules: { toolbar: [['bold', 'italic'], [{ 'list': 'bullet' }, { 'list': 'ordered' }]] } });
            document.getElementById('password').addEventListener('keypress', e => { if(e.key === 'Enter') handleLogin(); });
        });

        function startTime() {
            const now = new Date();
            document.getElementById('digitalClock').innerText = now.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
            document.getElementById('currentDate').innerText = now.toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long'});
        }

        function handleLogin() {
            if(document.getElementById('password').value === '123') {
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('mainDashboard').style.display = 'flex';
                loadData();
            } else { document.getElementById('loginError').innerText = "Password Salah!"; }
        }

        async function loadData() {
            const { data, error } = await _supabase.from('logData').select('*').order('logDate', { ascending: false });
            if (!error) renderTable(data);
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row.logDate}</td>
                    <td><span class="badge">${row.categoryLog}</span></td>
                    <td style="font-weight:600">${row.keyLearning}</td>
                    <td>
                        <div style="display:flex; gap:10px;">
                            <button onclick='viewDetail(${JSON.stringify(row)})' style="border:none; background:none; cursor:pointer; color:#3b82f6;"><i data-lucide="eye" style="width:18px"></i></button>
                            <button onclick='editLog(${JSON.stringify(row)})' style="border:none; background:none; cursor:pointer; color:#666;"><i data-lucide="edit-3" style="width:18px"></i></button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            lucide.createIcons();
        }

        async function openModal() {
            document.getElementById('modalOverlay').style.display = 'flex';
            document.getElementById('workForm').reset();
            quill.setContents([]);
            document.getElementById('editId').value = "";
            document.getElementById('logDate').value = new Date().toISOString().split('T')[0];
            const { count } = await _supabase.from('logData').select('*', { count: 'exact', head: true });
            document.getElementById('entryCount').value = (count || 0) + 1;
        }

        function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        function editLog(row) {
            document.getElementById('modalOverlay').style.display = 'flex';
            document.getElementById('editId').value = row.id;
            document.getElementById('logDate').value = row.logDate;
            document.getElementById('categoryLog').value = row.categoryLog;
            document.getElementById('keyLearning').value = row.keyLearning;
            quill.root.innerHTML = row.notesLog || "";

            originalData = {
                logDate: row.logDate,
                categoryLog: row.categoryLog,
                keyLearning: row.keyLearning,
                notesLog: quill.root.innerHTML.trim()
            };
        }

        document.getElementById('workForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const currentPayload = {
                logDate: document.getElementById('logDate').value,
                categoryLog: document.getElementById('categoryLog').value,
                keyLearning: document.getElementById('keyLearning').value,
                notesLog: quill.root.innerHTML.trim()
            };

            if (id && JSON.stringify(currentPayload) === JSON.stringify(originalData)) {
                showToast("Tidak ada perubahan.");
                return closeModal();
            }

            const btn = document.getElementById('btnSave');
            btn.innerText = "Saving..."; btn.disabled = true;

            let res = id ? await _supabase.from('logData').update(currentPayload).eq('id', id) : await _supabase.from('logData').insert([{...currentPayload, entryCount: parseInt(document.getElementById('entryCount').value)}]);

            if(!res.error) { closeModal(); loadData(); showToast("Berhasil disimpan!"); }
            else { alert("Error: " + res.error.message); }
            btn.innerText = "Save Data"; btn.disabled = false;
        };

        function viewDetail(row) {
            document.getElementById('detailOverlay').style.display = 'flex';
            document.getElementById('detTitle').innerText = row.keyLearning;
            document.getElementById('detMeta').innerText = `Log #${row.entryCount} • ${row.categoryLog} • ${row.logDate}`;
            document.getElementById('detContent').innerHTML = row.notesLog || "No notes.";
            lucide.createIcons();
        }

        function closeDetail() { document.getElementById('detailOverlay').style.display = 'none'; }
        
        function filterTable() {
            const val = document.getElementById('globalSearch').value.toLowerCase();
            document.querySelectorAll('#tableBody tr').forEach(r => r.style.display = r.innerText.toLowerCase().includes(val) ? '' : 'none');
        }
    </script>
</body>
</html>
